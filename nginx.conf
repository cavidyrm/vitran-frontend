# Static SPA server behind Traefik. Traefik handles TLS and host routing;
# nginx serves files, deep-link fallback, and Shopify CDN proxies.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /shopify-assets-proxy/ {
        proxy_pass https://shopify-assets.shopifycdn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host shopify-assets.shopifycdn.com;
        proxy_set_header Referer https://shop.app/;
    }

    location /cdn-shopify-proxy/ {
        proxy_pass https://cdn.shopify.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cdn.shopify.com;
        proxy_set_header Referer https://shop.app/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
