# Static SPA server behind Traefik. Traefik handles TLS and host routing;
# nginx serves files, deep-link fallback, Shopify CDN proxies, and COOP/COEP for Room OPFS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Required for SharedArrayBuffer / OPFS used by Room WebWorkerSQLiteDriver.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Baseline CSP. API calls are same-origin (`/api`, `/health`); extra hosts are fallback.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://api.vitran.ir https://vitran.ir; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Same-origin API when Traefik does not already split these paths to the backend.
    location /api/ {
        proxy_pass https://api.vitran.ir/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.vitran.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass https://api.vitran.ir/health;
        proxy_ssl_server_name on;
        proxy_set_header Host api.vitran.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /shopify-assets-proxy/ {
        proxy_pass https://shopify-assets.shopifycdn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host shopify-assets.shopifycdn.com;
        proxy_set_header Referer https://shop.app/;
        # Cross-origin loads of proxied assets need CORP when page has COEP.
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location /cdn-shopify-proxy/ {
        proxy_pass https://cdn.shopify.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cdn.shopify.com;
        proxy_set_header Referer https://shop.app/;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
