services:
  web:
    container_name: vitran-frontend-web
    image: ${DOCKER_IMAGE:-ghcr.io/cavidyrm/vitran-frontend:latest}
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # SPA on apex + www; /api/* is routed to the backend (priority 100 there).
      # HTTP→HTTPS redirect is handled globally by Traefik entrypoint config.
      - traefik.http.routers.vitran-web.rule=Host(`vitran.ir`) || Host(`www.vitran.ir`)
      - traefik.http.routers.vitran-web.entrypoints=websecure
      - traefik.http.routers.vitran-web.tls=true
      - traefik.http.routers.vitran-web.tls.certresolver=myresolver
      - traefik.http.routers.vitran-web.priority=1
      - traefik.http.routers.vitran-web.service=vitran-web
      - traefik.http.services.vitran-web.loadbalancer.server.port=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
